name: AI video transformation prototype checks

on:
  push:
    branches: [ai-video-transform-prototype]
    paths:
      - "pages/3_AI_Video_Transformation.py"
      - "gpu_worker/**"
      - "tests/**"
      - ".github/workflows/transform-prototype-check.yml"
  workflow_dispatch:

jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile pages/3_AI_Video_Transformation.py gpu_worker/story_plan.py gpu_worker/gradio_app.py gpu_worker/app.py gpu_worker/wan_animate_adapter.py gpu_worker/ti2v_adapter.py gpu_worker/telugu_tts.py gpu_worker/dialogue_audio.py tests/test_dialogue_audio.py tests/test_story_plan.py tests/test_wan_animate_adapter.py tests/test_ti2v_adapter.py tests/test_telugu_tts.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check ZIP and hashing standard library imports
        run: python -c "import hashlib, io, json, re, uuid, zipfile"
