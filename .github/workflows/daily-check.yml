name: Daily channel API check
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check required secret is configured
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY secret is not configured yet."
            exit 0
          fi
          echo "YouTube API secret is configured. Dashboard fetch is performed when opened."
