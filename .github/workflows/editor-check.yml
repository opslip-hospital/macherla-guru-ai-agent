name: Video editor syntax and FFmpeg smoke checks

on:
  push:
    branches: [main]
    paths:
      - "pages/2_AI_Video_Editor.py"
      - ".github/workflows/editor-check.yml"
  workflow_dispatch:

jobs:
  editor-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile pages/2_AI_Video_Editor.py
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Smoke-test enhancement filters
        run: |
          ffmpeg -v error -f lavfi -i testsrc2=size=320x180:rate=24:duration=1 -vf "hqdn3d=1.5:1.5:6:6,eq=brightness=0:contrast=1.05:saturation=1.05,unsharp=5:5:0.7:3:3:0.0,scale=640:360:flags=lanczos,pad=640:360:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p" -f null -
      - name: Smoke-test chroma-key compositing
        run: |
          ffmpeg -v error -f lavfi -i color=c=green:s=320x180:d=1 -f lavfi -i color=c=red:s=320x180:d=1 -filter_complex "[0:v]chromakey=0x00FF00:0.18:0.08,format=yuva420p[fg];[1:v][fg]overlay=0:0,format=yuv420p[v]" -map "[v]" -f null -
      - name: Smoke-test slow-motion interpolation
        run: |
          ffmpeg -v error -f lavfi -i testsrc2=size=160x90:rate=12:duration=0.5 -vf "setpts=2*PTS,minterpolate=fps=24:mi_mode=mci:mc_mode=aobmc:me_mode=bidir" -f null -
      - name: Smoke-test speaker-visible B-roll side-by-side layout
        run: |
          ffmpeg -v error -f lavfi -i testsrc2=size=320x180:rate=30:duration=1 -f lavfi -i color=c=red:s=320x180:r=30:d=1 -filter_complex "[0:v]scale=160:180:force_original_aspect_ratio=decrease,pad=160:180:(ow-iw)/2:(oh-ih)/2,setsar=1[left];[1:v]scale=160:180:force_original_aspect_ratio=increase,crop=160:180,setsar=1[right];[left][right]hstack=inputs=2:shortest=1,format=yuv420p[out]" -map "[out]" -f null -

      - name: Smoke-test 2K portrait MP4 export
        run: |
          ffmpeg -v error -f lavfi -i testsrc2=size=320x180:rate=24:duration=1 -vf "scale=1440:2560:force_original_aspect_ratio=decrease:flags=lanczos,pad=1440:2560:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p" -c:v libx264 -preset ultrafast -crf 23 -movflags +faststart /tmp/editor-2k.mp4
          test -s /tmp/editor-2k.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 /tmp/editor-2k.mp4 | grep -Fx "1440x2560"
      - name: Smoke-test SRT subtitle burn-in
        run: |
          printf '1\n00:00:00,100 --> 00:00:00,900\nTest subtitle\n' > /tmp/editor-test.srt
          ffmpeg -v error -f lavfi -i testsrc2=size=320x180:rate=24:duration=1 -vf "subtitles=/tmp/editor-test.srt:force_style='FontName=Arial,FontSize=20,Outline=2'" -c:v libx264 -pix_fmt yuv420p /tmp/editor-subs.mp4
          test -s /tmp/editor-subs.mp4
      - name: Smoke-test split and merge with mixed audio sources
        run: |
          ffmpeg -v error -f lavfi -i testsrc2=size=160x90:rate=24:duration=2 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/editor-with-audio.mp4
          ffmpeg -v error -f lavfi -i testsrc2=size=120x160:rate=15:duration=1 -c:v libx264 -pix_fmt yuv420p /tmp/editor-silent.mp4
          ffmpeg -v error -y -i /tmp/editor-with-audio.mp4 -t 1 -c:v libx264 -c:a aac /tmp/editor-part1.mp4
          ffmpeg -v error -y -ss 1 -i /tmp/editor-with-audio.mp4 -c:v libx264 -c:a aac /tmp/editor-part2.mp4
          test -s /tmp/editor-part1.mp4 && test -s /tmp/editor-part2.mp4
          ffmpeg -v error -y -i /tmp/editor-silent.mp4 -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=48000 -map 0:v:0 -map 1:a:0 -vf "scale=320:180:force_original_aspect_ratio=decrease,pad=320:180:(ow-iw)/2:(oh-ih)/2,fps=30,setsar=1,format=yuv420p" -c:v libx264 -c:a aac -shortest /tmp/editor-normalized-silent.mp4
          printf "file '/tmp/editor-part1.mp4'\nfile '/tmp/editor-normalized-silent.mp4'\n" > /tmp/editor-concat.txt
          ffmpeg -v error -y -f concat -safe 0 -i /tmp/editor-concat.txt -c copy /tmp/editor-merged.mp4
          test -s /tmp/editor-merged.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/editor-merged.mp4 | awk '{ if ($1 < 1.5 || $1 > 3.0) exit 1 }'
      - name: Smoke-test AI background composite and audio mapping
        run: |
          ffmpeg -v error -f lavfi -i color=c=blue:s=320x180:r=12:d=1 -f lavfi -i color=c=red@0.0:s=160x90:r=12:d=1,format=rgba -f lavfi -i sine=frequency=660:sample_rate=48000:duration=1 -filter_complex "[1:v]format=rgba,colorchannelmixer=aa=0.7[fg];[0:v][fg]scale2ref[bg][subject];[bg][subject]overlay=shortest=1,format=yuv420p[v]" -map "[v]" -map 2:a:0 -shortest -c:v libx264 -c:a aac /tmp/editor-ai-composite.mp4
          test -s /tmp/editor-ai-composite.mp4
