name: Validate YouTube Manager fixes

on:
  push:
    branches:
      - "claude-issues-fixes-*"
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile app.py
        run: python -m py_compile app.py
      - name: Verify single Gemini model and retry policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path("app.py").read_text(encoding="utf-8")
          assert 'GEMINI_MODEL = "gemini-3.5-flash-lite"' in source
          assert not re.search(r"gemini-(?!3\\.5-flash-lite)[A-Za-z0-9.-]+", source)
          assert "thinkingConfig" not in source and "thinkingLevel" not in source
          assert "def _gemini_retry_seconds(" in source
          assert "def gemini_generate_content(" in source
          helper = source.split("def gemini_generate_content(", 1)[1].split("\\ndef ", 1)[0]
          assert helper.count("requests.post(") == 2
          assert "time.sleep(delay)" in helper
          assert 'st.session_state["gemini_video_file_cache"]' in source
          assert "saved fileని మళ్లీ ఉపయోగిస్తున్నాను" in source
          print("Gemini single-model and retry-policy checks passed")
          PY
      - name: Test metadata helper limits
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path("app.py").read_text(encoding="utf-8"))
          names = {"_is_metadata_tag_character", "normalize_hashtags", "normalize_title_options", "normalize_youtube_tags", "build_youtube_description", "youtube_category_id", "caption_with_five_hashtags"}
          nodes = [node for node in tree.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in names]
          assert {node.name for node in nodes} == names
          module = ast.Module(body=nodes, type_ignores=[])
          import unicodedata
          namespace = {"unicodedata": unicodedata}
          exec(compile(module, "metadata_helpers", "exec"), namespace)
          tags = namespace["normalize_hashtags"](["#one", "#two", "#three", "#four", "#five", "#six"])
          assert len(tags) == 5 and all(tag.startswith("#") for tag in tags)
          titles = namespace["normalize_title_options"](["Title A", "Title A", "Title B"], fallback_title="Best Title")
          assert titles == ["Best Title", "Title A", "Title B"]
          youtube_tags = namespace["normalize_youtube_tags"](["x" * 300, "y" * 300])
          assert sum(map(len, youtube_tags)) + max(0, len(youtube_tags) - 1) <= 500
          description, clipped = namespace["build_youtube_description"]("తెలుగు" * 2000, tags)
          assert len(description.encode("utf-8")) <= 5000 and clipped
          assert len([part for part in description.split() if part.startswith("#")]) == 5
          cleaned, _ = namespace["build_youtube_description"]("Hook #old\nMore detail", tags)
          assert "#old" not in cleaned
          assert namespace["youtube_category_id"]("Comedy") == "23"
          caption = namespace["caption_with_five_hashtags"]("Hook #old #old2", tags)
          assert len([part for part in caption.split() if part.startswith("#")]) == 5
          print("metadata helper tests passed")
          PY
