name: Universal Auto Director real render tests

on:
  push:
    branches: [main]
    paths:
      - "gpu_worker/comedy_edit.py"
      - "gpu_worker/auto_director.py"
      - "gpu_worker/auto_subtitles.py"
      - "pages/4_Universal_AI_Auto_Director.py"
      - ".github/workflows/universal-auto-director-check.yml"
  workflow_dispatch:

jobs:
  render-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install editor dependencies
        run: python -m pip install --upgrade pip imageio-ffmpeg requests "opencv-python-headless>=4.10,<4.12"
      - name: Compile editor modules
        run: python -m py_compile gpu_worker/comedy_edit.py gpu_worker/auto_director.py gpu_worker/auto_subtitles.py gpu_worker/gemini_director.py pages/4_Universal_AI_Auto_Director.py
      - name: Render real synthetic MP4s and verify audio, silent input, music, subtitles, and speed
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          import imageio_ffmpeg
          from gpu_worker.comedy_edit import render_comedy_edit
          from gpu_worker.auto_director import detect_scene_changes, detect_face_tracking, make_comedy_edit_decision

          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              silent = root / "silent.mp4"
              voiced = root / "voiced.mp4"
              music = root / "music.m4a"
              sfx = root / "sfx.wav"
              srt = root / "captions.srt"

              def run(args):
                  result = subprocess.run(args, capture_output=True, text=True, timeout=120)
                  if result.returncode:
                      raise RuntimeError((result.stderr or result.stdout)[-3000:])

              run([ffmpeg, "-y", "-f", "lavfi", "-i", "testsrc2=size=320x180:rate=24:duration=3",
                   "-an", "-c:v", "libx264", "-pix_fmt", "yuv420p", str(silent)])
              run([ffmpeg, "-y", "-f", "lavfi", "-i", "testsrc2=size=320x180:rate=24:duration=3",
                   "-f", "lavfi", "-i", "sine=frequency=440:sample_rate=48000:duration=3",
                   "-shortest", "-c:v", "libx264", "-pix_fmt", "yuv420p", "-c:a", "aac", str(voiced)])
              run([ffmpeg, "-y", "-f", "lavfi", "-i", "sine=frequency=660:sample_rate=48000:duration=3",
                   "-c:a", "aac", str(music)])
              run([ffmpeg, "-y", "-f", "lavfi", "-i", "sine=frequency=880:sample_rate=48000:duration=0.8",
                   "-c:a", "pcm_s16le", str(sfx)])
              face_points = detect_face_tracking(str(voiced), aspect_ratio="9:16", max_duration=3)
              assert isinstance(face_points, list)
              print(f"PASS face tracking sampling: {len(face_points)} face anchors")
              cuts = detect_scene_changes(str(voiced), threshold=0.1, max_duration=3)
              plan = make_comedy_edit_decision(cuts, duration=3)
              assert plan["duration_seconds"] == 3.0 and isinstance(plan["punch_moments"], list)
              print(f"PASS scene analysis and edit plan: {len(cuts)} visual changes")
              srt.write_text("1\n00:00:00,200 --> 00:00:02,500\nTest caption\n", encoding="utf-8")

              cases = [
                  ("silent-no-music", silent, {}),
                  ("voiced-no-music-fast", voiced, {"playback_speed": 1.15, "face_track_points": [{"time": 0.0, "x": 0.35, "y": 0.5}, {"time": 1.0, "x": 0.65, "y": 0.5}]}),
                  ("voiced-music-srt-slow", voiced, {"music_file": str(music), "subtitle_file": str(srt), "playback_speed": 0.85}),
                  ("silent-with-music", silent, {"music_file": str(music)}),
                  ("voiced-timed-sfx", voiced, {"sfx_file": str(sfx), "sfx_volume": 0.2, "punch_times": [0.5, 1.6], "punch_cues": [{"time": 0.5, "kind": "reaction_emphasis"}, {"time": 1.6, "kind": "dialogue_emphasis"}]}),
                  ("voiced-music-sfx-slow", voiced, {"music_file": str(music), "sfx_file": str(sfx), "sfx_volume": 0.2, "playback_speed": 0.85, "punch_times": [0.5, 1.6]}),
                  ("silent-sfx-only", silent, {"sfx_file": str(sfx), "sfx_volume": 0.25, "punch_times": [0.75]}),
              ]
              for label, source, options in cases:
                  output = root / f"{label}.mp4"
                  render_comedy_edit(str(source), str(output), max_duration=3, intensity="High",
                                     aspect_ratio="9:16", timeout_seconds=180, **options)
                  if not output.is_file() or output.stat().st_size < 1024:
                      raise RuntimeError(f"{label}: output MP4 missing or too small")
                  probe = subprocess.run([ffmpeg, "-hide_banner", "-i", str(output)],
                                         capture_output=True, text=True, timeout=30)
                  if "Video:" not in (probe.stderr or "") or "Duration:" not in (probe.stderr or ""):
                      raise RuntimeError(f"{label}: FFmpeg could not read output MP4")
                  print(f"PASS {label}: {output.stat().st_size} bytes")

              # Exercise Whisper result formatting without downloading a speech model.
              import sys
              import types
              from gpu_worker.auto_subtitles import transcribe_to_srt
              class FakeWord:
                  def __init__(self, start, end, word):
                      self.start, self.end, self.word = start, end, word
              class FakeSegment:
                  def __init__(self, start, end, text):
                      self.start, self.end, self.text = start, end, text
                      self.words = [FakeWord(start, min(end, start + 0.25), text.split()[0])]
              class FakeWhisperModel:
                  def __init__(self, *args, **kwargs):
                      pass
                  def transcribe(self, *args, **kwargs):
                      return iter([FakeSegment(0.25, 0.95, "నమస్కారం మావా"), FakeSegment(1.2, 2.0, "ఇది పరీక్ష")]), None
              sys.modules["faster_whisper"] = types.SimpleNamespace(WhisperModel=FakeWhisperModel)
              dummy_input = root / "speech-source.mp4"
              dummy_input.write_bytes(b"fake input for mocked speech model")
              transcript_srt = root / "speech.srt"
              punch_json = root / "speech-points.json"
              transcript_json = root / "transcript.json"
              word_json = root / "word-timestamps.json"
              transcribe_to_srt(str(dummy_input), str(transcript_srt),
                                punch_points_path=str(punch_json),
                                transcript_path=str(transcript_json),
                                word_timestamps_path=str(word_json))
              import json
              segments = json.loads(transcript_json.read_text(encoding="utf-8"))
              points = json.loads(punch_json.read_text(encoding="utf-8"))
              word_times = json.loads(word_json.read_text(encoding="utf-8"))
              assert len(segments) == 2 and segments[0]["text"] == "నమస్కారం మావా"
              assert len(word_times) == 2 and word_times[0]["word"] == "నమస్కారం"
              assert points == [0.25, 1.2]
              assert "నమస్కారం మావా" in transcript_srt.read_text(encoding="utf-8")
              print("PASS Whisper transcript, word timing, subtitle timing, and speech punch-point export")
              # Mock the Gemini Files upload + video understanding API without a paid API call.
              from gpu_worker import gemini_director
              class FakeResponse:
                  def __init__(self, payload=None, headers=None):
                      self.payload, self.headers = payload or {}, headers or {}
                  def raise_for_status(self):
                      pass
                  def json(self):
                      return self.payload
              calls = []
              def fake_post(url, **kwargs):
                  calls.append((url, kwargs))
                  if url.endswith("/upload/v1beta/files"):
                      return FakeResponse(headers={"X-Goog-Upload-URL": "https://upload.test/session"})
                  if url == "https://upload.test/session":
                      return FakeResponse({"file": {"name": "files/test", "uri": "https://files.test/video", "state": "ACTIVE"}})
                  if url.endswith("/models/gemini-3.8-flash:generateContent"):
                      return FakeResponse({"candidates": [{"content": {"parts": [{"text": json.dumps({
                          "summary": "Telugu comedy clip",
                          "moments": [{"time": 1.25, "kind": "comedy", "reason": "Punchline"}]
                      })}]}}]})
                  raise AssertionError("Unexpected Gemini URL: " + url)
              original_post = gemini_director.requests.post
              gemini_director.requests.post = fake_post
              try:
                  gemini_video = root / "gemini-test.mp4"
                  gemini_video.write_bytes(b"mock video bytes")
                  analysis = gemini_director.analyze_video_with_gemini(str(gemini_video), "fake-key")
                  assert analysis["summary"] == "Telugu comedy clip"
                  assert analysis["moments"][0]["time"] == 1.25
                  assert any("/models/gemini-3.8-flash:generateContent" in call[0] for call in calls)
                  generate_call = next(call for call in calls if "/models/gemini-3.8-flash:generateContent" in call[0])
                  video_part = generate_call[1]["json"]["contents"][0]["parts"][0]
                  assert video_part.get("media_processing") == "AGENTIC"
                  print("PASS mocked Gemini Files upload, agentic video analysis, and director moments")
              finally:
                  gemini_director.requests.post = original_post

          PY
